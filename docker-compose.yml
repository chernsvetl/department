# Локальный PostgreSQL для помощника секретаря кафедры.
# Запуск: docker compose up -d
# Контейнер создаёт базу "department"; таблицы накатывает Liquibase (db/changelog),
# данные онтологии заливает OntologyMigrator — всё при запуске Main.
# Внимание: если на 5432 уже слушает локальный PostgreSQL, docker-контейнер
# до порта не доберётся — приложение подключится к локальному серверу.
services:
  postgres:
    image: postgres:17
    container_name: department-postgres
    environment:
      POSTGRES_DB: department
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - department-postgres-data:/var/lib/postgresql/data

volumes:
  department-postgres-data:

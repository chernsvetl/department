# Server configuration
server.port=8080

# Fuseki SPARQL endpoint
# Local dev:  http://localhost:3030/ontology/sparql
# In Docker:  http://jena-fuseki:3030/ontology/sparql
fuseki.sparql.endpoint=${FUSEKI_ENDPOINT:http://localhost:3030/ontology/sparql}
fuseki.update.endpoint=${FUSEKI_UPDATE_ENDPOINT:http://localhost:3030/ontology/update}
ontology.base-namespace=http://www.semanticweb.org/oleyn/ontologies/2022/4/\u043a\u0430\u0444\u0435\u0434\u0440\u0430#

# Перенос онтологии в PostgreSQL кафедры — запускается сразу после каждой отправки формы:
# gradlew migrateOntology в корне проекта department (граф Fuseki -> файл owl -> PostgreSQL).
# department.project-dir — корень department (относительный путь — от каталога запуска бэкенда);
# DEPARTMENT_PROJECT_DIR / DEPARTMENT_MIGRATE_CMD — переопределение через окружение.
department.project-dir=${DEPARTMENT_PROJECT_DIR:../../../..}
department.migrate-cmd=${DEPARTMENT_MIGRATE_CMD:}

# Email (SMTP) — g.nsu.ru uses Google Workspace, so Gmail SMTP
# Set MAIL_USERNAME and MAIL_PASSWORD via environment variables
# auth.mail.mock=true — письма не отправляются, код подтверждения печатается в лог бэкенда
auth.mail.mock=${MAIL_MOCK:true}
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:shabanov.dima11203@gmail.com}
spring.mail.password=${MAIL_PASSWORD:lpmiwunexybmqtnb}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# spring.mail.properties.mail.smtp.connectiontimeout=5000
# spring.mail.properties.mail.smtp.timeout=5000
# spring.mail.properties.mail.smtp.writetimeout=5000

# Auth settings
auth.code.ttl-minutes=10
# Ограничение домена почты для входа студентов; пусто — разрешена почта любого домена
# auth.allowed-domain=g.nsu.ru
auth.allowed-domain=

# Пайплайн: 1) проверка стиля -> 2) сборка -> 3) тесты
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: "1. Чек стайл"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

  build:
    name: "2. Сборка"
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка проекта
        run: ./gradlew assemble -x test --no-daemon

  test:
    name: "3. Тесты"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Прогон тестов
        run: ./gradlew test --no-daemon
